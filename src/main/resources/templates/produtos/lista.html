<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="page-header">
        <div><p class="eyebrow">CATÁLOGO</p><h1>Produtos</h1><p>Os preços exibidos aqui são usados pelo servidor para calcular cada pedido.</p></div>
        <a th:href="@{/produtos/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','GERENTE')"><i class="bi bi-plus-lg me-1"></i>Novo produto</a>
    </div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Nome</th><th>Tipo</th><th>Preço</th><th>Situação</th><th class="text-end">Ações</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5" class="text-center text-secondary py-5">Nenhum produto cadastrado.</td></tr>
            <tr th:each="produto : ${produtos}">
                <td class="fw-semibold" th:text="${produto.nome}">Produto</td>
                <td th:text="${produto.tipo}">Tipo</td>
                <td th:text="|R$ ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>
                <td><span class="badge" th:classappend="${produto.ativo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${produto.ativo ? 'Ativo' : 'Inativo'}">Ativo</span></td>
                <td class="text-end text-nowrap" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                    <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este produto?');"><button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
