<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="page-header"><div><p class="eyebrow">PRODUTOS</p><h1 th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}">Produto</h1></div></div>
    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="card border-0 shadow-sm" style="max-width: 760px">
        <input type="hidden" th:field="*{id}">
        <div class="card-body p-4"><div class="row g-3">
            <div class="col-md-7"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" th:field="*{nome}" maxlength="120" required></div>
            <div class="col-md-5"><label class="form-label" for="tipo">Tipo</label><select class="form-select" id="tipo" th:field="*{tipo}" required><option value="">Selecione</option><option value="Pizza">Pizza</option><option value="Esfiha">Esfiha</option><option value="Lanche">Lanche</option><option value="Bebida">Bebida</option><option value="Porção">Porção</option><option value="Adicional">Adicional</option></select></div>
            <div class="col-md-5"><label class="form-label" for="preco">Preço</label><div class="input-group"><span class="input-group-text">R$</span><input class="form-control" type="number" min="0.01" step="0.01" id="preco" th:field="*{preco}" required></div></div>
            <div class="col-md-7 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}"><label class="form-check-label" for="ativo">Disponível para venda</label></div></div>
        </div></div>
        <div class="card-footer bg-white border-0 p-4 pt-0 d-flex gap-2"><button class="btn btn-primary" type="submit">Salvar</button><a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a></div>
    </form>
</div>
</body>
</html>
