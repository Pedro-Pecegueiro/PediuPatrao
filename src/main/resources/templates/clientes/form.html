<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="page-header"><div><p class="eyebrow">CLIENTES</p><h1 th:text="${cliente.id == null ? 'Novo cliente' : 'Editar cliente'}">Cliente</h1><p>Telefone e endereço são auditados quando alterados.</p></div></div>
    <form th:action="${cliente.id == null} ? @{/clientes/salvar} : @{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post" class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="row g-3">
                <div class="col-md-8"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" th:field="*{nome}" maxlength="120" required></div>
                <div class="col-md-4"><label class="form-label" for="telefone">Telefone</label><input class="form-control" id="telefone" th:field="*{telefone}" maxlength="25" required></div>
                <div class="col-md-3"><label class="form-label" for="cep">CEP</label><input class="form-control" id="cep" th:field="*{cep}" maxlength="10"></div>
                <div class="col-md-7"><label class="form-label" for="logradouro">Logradouro</label><input class="form-control" id="logradouro" th:field="*{logradouro}" maxlength="150"></div>
                <div class="col-md-2"><label class="form-label" for="numero">Número</label><input class="form-control" id="numero" th:field="*{numero}" maxlength="15"></div>
                <div class="col-md-4"><label class="form-label" for="complemento">Complemento</label><input class="form-control" id="complemento" th:field="*{complemento}" maxlength="80"></div>
                <div class="col-md-3"><label class="form-label" for="bairro">Bairro</label><input class="form-control" id="bairro" th:field="*{bairro}" maxlength="80"></div>
                <div class="col-md-3"><label class="form-label" for="cidade">Cidade</label><input class="form-control" id="cidade" th:field="*{cidade}" maxlength="80"></div>
                <div class="col-md-2"><label class="form-label" for="estado">UF</label><input class="form-control text-uppercase" id="estado" th:field="*{estado}" maxlength="2"></div>
            </div>
        </div>
        <div class="card-footer bg-white border-0 p-4 pt-0 d-flex gap-2"><button class="btn btn-primary" type="submit">Salvar</button><a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a></div>
    </form>
</div>
</body>
</html>
