<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="page-header">
        <div><p class="eyebrow">CADASTRO</p><h1>Clientes</h1><p>Dados de contato e entrega com alterações registradas na auditoria.</p></div>
        <a th:href="@{/clientes/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')"><i class="bi bi-person-plus me-1"></i>Novo cliente</a>
    </div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark"><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="text-center text-secondary py-5">Nenhum cliente cadastrado.</td></tr>
                <tr th:each="cliente : ${clientes}">
                    <td class="fw-semibold" th:text="${cliente.nome}">Nome</td>
                    <td th:text="${cliente.telefone}">Telefone</td>
                    <td>
                        <span th:text="|${cliente.logradouro ?: ''}, ${cliente.numero ?: 's/n'}|">Endereço</span>
                        <small class="d-block text-secondary" th:text="|${cliente.bairro ?: ''} - ${cliente.cidade ?: ''}/${cliente.estado ?: ''}|">Cidade</small>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">Editar</a>
                        <form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post" class="d-inline" sec:authorize="hasAnyRole('ADMIN','GERENTE')" onsubmit="return confirm('Excluir este cliente? A operação será auditada.');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
