<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - PediuPatrão Pedro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-shell">
    <section class="login-hero">
        <img th:src="@{/images/logo_interna.png}" alt="PediuPatrão Pedro">
        <h1>Controle completo da pizzaria</h1>
    </section>
    <section class="login-card">
        <h2>Entrar no sistema</h2>
        <p class="text-secondary">Informe suas credenciais para continuar.</p>
        <div class="alert alert-danger" th:if="${param.error}">Usuário, senha ou conta inválida.</div>
        <div class="alert alert-success" th:if="${param.logout}">Sessão encerrada com segurança.</div>
        <form th:action="@{/login}" method="post">
            <label class="form-label" for="username">Usuário</label>
            <input class="form-control mb-3" id="username" name="username" autocomplete="username" required autofocus>
            <label class="form-label" for="password">Senha</label>
            <input class="form-control mb-4" type="password" id="password" name="password" autocomplete="current-password" required>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
    </section>
</div>
</body>
</html>
