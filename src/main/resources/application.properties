spring.application.name=PediuPatrão Pedro
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pediupatrao_pedro}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}
app.bootstrap.gerente-password=${GERENTE_PASSWORD:Gerente@123}
app.bootstrap.atendente-password=${ATENDENTE_PASSWORD:Atendente@123}

logging.level.com.umc.pediupatrao=INFO
